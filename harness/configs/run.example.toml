# Run config (docs/harness.md §6, §6.2).
#
# Loaded by driver/config.py. Selects model + reasoning effort, budget caps, the
# target/scope file, and the output dir. Copy → run.<name>.toml per engagement.
#
# Needs OPENROUTER_API_KEY in the environment (gateway/client.py, §6).

[model]
id = "deepseek/deepseek-v4-flash"        # verify id on OpenRouter before wiring (§6)
reasoning = "high"                        # off | high | xhigh
fallbacks = [                             # availability, not refusal (§6.1.4)
  "moonshotai/kimi-k2",
  "z-ai/glm-4.6",
]

[budget]                                  # interceptor enforces, gateway measures (§6.2)
max_usd = 5.0                             # 0 = unlimited
max_tokens = 2_000_000                    # 0 = unlimited
max_tool_calls = 60                       # cheap runaway-loop guard (§6.2)

[target]
scope_file = "scope.juiceshop.yaml"       # resolved relative to this file

[output]
dir = "runs"                              # run artifacts: events.jsonl + report.json
