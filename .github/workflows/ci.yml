name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest # Docker present -> Testcontainers spins real Postgres
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build # turbo: contracts (tsc) then control-plane (nest build)

      - name: Test
        run: bun run test # drift spec + migrations + health on real Postgres

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck
