name: Release

# Component H release path (docs/component-h-hardening.md §8.4): build + scan the
# control-plane image, push to GHCR, run the reduced red-team pass against an
# ephemeral kind cluster, then deploy to GKE via Helm (manual approval before prod).
# Runs on tags (v*) and on pushes to main; the deploy step is gated by an
# environment with an approval rule.

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to GHCR
  id-token: write # OIDC to authenticate to GKE

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/control-plane
  HARNESS_IMAGE: ghcr.io/${{ github.repository_owner }}/harness
  GKE_CLUSTER: autosploit-demo
  GKE_REGION: us-central1

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest ./control-plane

      - name: Scan image (Trivy) — fail on high/critical
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: $IMAGE:$GITHUB_SHA
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Leak scan (model key must never be in the image)
        run: |
          docker run --rm --entrypoint sh $IMAGE:$GITHUB_SHA -c \
            'grep -rIs "OPENROUTER_API_KEY" / 2>/dev/null | grep -v "^Binary" || true' \
            | tee /tmp/leaks.txt
          if [ -s /tmp/leaks.txt ]; then
            echo "❌ Image leak scan found references:"; cat /tmp/leaks.txt; exit 1
          fi
          echo "✅ no OPENROUTER_API_KEY reference in image"

      - name: Push image
        run: docker push $IMAGE:$GITHUB_SHA && docker push $IMAGE:latest

  # Roadmap M5 role 1: build, scan, and push the attacker HARNESS image and emit its
  # digest, so the conductor pulls it by digest (deploy-gke consumes the output). Same
  # build-scan-leak-push shape as the control-plane build-push job above; the leak scan
  # targets the key VALUE shape because the harness ships Python source where the
  # env-var NAME legitimately appears (docs/m5-phases.md Phase 1).
  harness-build-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build harness image
        run: docker build -t $HARNESS_IMAGE:$GITHUB_SHA -t $HARNESS_IMAGE:latest ./harness

      - name: Scan image (Trivy) — fail on high/critical
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: $HARNESS_IMAGE:$GITHUB_SHA
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Leak scan (model key value must never be in the image)
        run: |
          docker run --rm --entrypoint sh $HARNESS_IMAGE:$GITHUB_SHA -c \
            'grep -rIsE "sk-or-[A-Za-z0-9-]{8,}" / 2>/dev/null | grep -v "^Binary" || true' \
            | tee /tmp/harness-leaks.txt
          if [ -s /tmp/harness-leaks.txt ]; then
            echo "❌ Harness image leak scan found a key value:"; cat /tmp/harness-leaks.txt; exit 1
          fi
          echo "✅ no model-key value in the harness image"

      - name: Push image and emit digest
        id: push
        run: |
          docker push $HARNESS_IMAGE:$GITHUB_SHA && docker push $HARNESS_IMAGE:latest
          # RepoDigests is populated after a successful push; the by-digest ref is what
          # the conductor pulls (AUTOSPLOIT_HARNESS_IMAGE).
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' $HARNESS_IMAGE:$GITHUB_SHA)
          echo "harness image digest: $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  redteam-kind:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.1.0 }
      - name: Install kind
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/
      - name: Create cluster
        run: kind create cluster --name autosploit-cicd
      - name: Reduced red-team pass
        run: ./scripts/redteam.sh --namespace default --ingest-token "${{ secrets.INGEST_TOKEN_SIGNING_KEY }}"

  deploy-gke:
    runs-on: ubuntu-latest
    needs: [build-push, harness-build-push, redteam-kind]
    # Gate prod deploys behind a manual approval environment.
    environment: production
    concurrency: production
    env:
      # M5: the digest-pinned attacker harness ref the conductor launches by digest.
      # The conductor reads this via its `_run_k8s` seam (docs/m5-phases.md Phase 3)
      # and threads it to the engagement chart's `attacker.image`. Sourced from the
      # scanned+pushed harness-build-push job so prod never launches an unpinned image.
      AUTOSPLOIT_HARNESS_IMAGE: ${{ needs.harness-build-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/autosploit/providers/github
          service_account: autosploit-plane-github@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install control-plane ./deploy/helm/control-plane \
            --namespace default \
            --set image.tag=$GITHUB_SHA \
            --set image.repository=$IMAGE

      - name: Full red-team pass on GKE (release gate)
        run: |
          # Wait for rollout, then run the full §7 pass against the real
          # NetworkPolicy + ingest.
          kubectl rollout status deployment/control-plane-control-plane-app --timeout=300s
          INGEST_TOKEN="${{ secrets.INGEST_TOKEN_SIGNING_KEY }}" \
            ./scripts/redteam.sh --namespace default