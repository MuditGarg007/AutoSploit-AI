name: Release

# Component H release path (docs/component-h-hardening.md §8.4): build + scan the
# control-plane and harness images and push them to GHCR. Deploy is NOT done here:
# the backend runs on a self-hosted KVM VPS (kind + Cilium + gVisor), and both the
# `helm install` and the H3 red-team gate are run manually on that box per
# docs/vps-h3-runbook.md (§5 deploy, §7 red-team). GKE was the demo substrate only
# and has been removed. Runs on tags (v*) and on pushes to main.

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/muditgarg007/control-plane
  HARNESS_IMAGE: ghcr.io/muditgarg007/harness

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch (docs/oracle-a1-h3-runbook.md §A.1): the Oracle A1 substrate is
      # aarch64, so every image must publish linux/arm64 alongside linux/amd64. QEMU
      # emulates arm64 on the x86 runner; the pushed manifest list lets each node pull
      # its own arch by digest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Scan + leak checks need the image loaded into the local Docker daemon, which a
      # multi-platform manifest cannot be. Build+load the amd64 image once for scanning;
      # the arm64 layers are built again (from cache) in the push step below.
      - name: Build image (amd64, for scanning)
        run: |
          docker buildx build --platform linux/amd64 --load \
            -f control-plane/Dockerfile -t $IMAGE:scan .

      - name: Leak scan (model key value must never be in the image)
        run: |
          # Match the key VALUE shape, not the env-var NAME: the control-plane dist/
          # ships source comments that legitimately mention OPENROUTER_API_KEY to
          # document that the key is deliberately absent (the conductor resolves it,
          # §6). Grepping the name flags those comments; grep the sk-or- value shape
          # instead, same as the harness leak scan.
          docker run --rm --entrypoint sh $IMAGE:scan -c \
            'grep -rIsE "sk-or-[A-Za-z0-9-]{8,}" / 2>/dev/null | grep -v "^Binary" || true' \
            | tee /tmp/leaks.txt
          if [ -s /tmp/leaks.txt ]; then
            echo "❌ Image leak scan found model-key values:"; cat /tmp/leaks.txt; exit 1
          fi
          echo "✅ no OPENROUTER model-key value in image"

      - name: Build and push multi-arch manifest (amd64 + arm64)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f control-plane/Dockerfile -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest --push .

  # Roadmap M5 role 1: build, scan, and push the attacker HARNESS image and emit its
  # digest, so the conductor pulls it by digest (the manual VPS deploy consumes the
  # output as AUTOSPLOIT_HARNESS_IMAGE, docs/vps-h3-runbook.md §4.1). Same
  # build-scan-leak-push shape as the control-plane build-push job above; the leak scan
  # targets the key VALUE shape because the harness ships Python source where the
  # env-var NAME legitimately appears (docs/m5-phases.md Phase 1).
  harness-build-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch (docs/oracle-a1-h3-runbook.md §A.1): the harness runs on the aarch64
      # A1 node, so its manifest must include linux/arm64. The manifest-list digest the
      # conductor pins resolves to the arm64 image automatically on that node.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build+load the amd64 image once so the scan + leak checks can run against a
      # locally-loaded (single-arch) image; the push step rebuilds both arches from cache.
      - name: Build harness image (amd64, for scanning)
        run: |
          docker buildx build --platform linux/amd64 --load \
            -t $HARNESS_IMAGE:scan ./harness

      - name: Leak scan (model key value must never be in the image)
        run: |
          docker run --rm --entrypoint sh $HARNESS_IMAGE:scan -c \
            'grep -rIsE "sk-or-[A-Za-z0-9-]{8,}" / 2>/dev/null | grep -v "^Binary" || true' \
            | tee /tmp/harness-leaks.txt
          if [ -s /tmp/harness-leaks.txt ]; then
            echo "❌ Harness image leak scan found a key value:"; cat /tmp/harness-leaks.txt; exit 1
          fi
          echo "✅ no model-key value in the harness image"

      - name: Build and push multi-arch manifest and emit digest
        id: push
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t $HARNESS_IMAGE:$GITHUB_SHA -t $HARNESS_IMAGE:latest \
            --push --metadata-file /tmp/harness-meta.json ./harness
          # The manifest-list digest the conductor pulls (AUTOSPLOIT_HARNESS_IMAGE);
          # buildx writes it to the metadata file. A single by-digest ref resolves to
          # the right arch on each node.
          digest_ref="$HARNESS_IMAGE@$(jq -r '."containerimage.digest"' /tmp/harness-meta.json)"
          echo "harness image digest: $digest_ref"
          echo "digest=$digest_ref" >> "$GITHUB_OUTPUT"

  # NOTE: there is no deploy job in CI. The backend runs on a self-hosted KVM VPS
  # (kind + Cilium + gVisor), which cannot be stood up on a bare ubuntu-latest
  # runner — it needs a full KVM kernel, eBPF/BTF, gVisor host binaries, and the
  # kernel-pinned Cilium build from scripts/m4-bootstrap.sh. So both the deploy
  # (`helm install`, docs/vps-h3-runbook.md §5) and the full §7 red-team gate are
  # run manually on the VPS; the red-team pass is proven GREEN on Contabo (H3,
  # 2026-10-06). The reduced kind pass that once stubbed this stage was removed
  # for the same reason and stays H-Q1 future work.
  #
  # The digest-pinned attacker harness ref emitted by harness-build-push
  # (needs.harness-build-push.outputs.digest) is the AUTOSPLOIT_HARNESS_IMAGE the
  # conductor launches by digest (docs/m5-phases.md Phase 3) during that manual run.
  #
  # Optional future work (docs/vps-h3-runbook.md §7.4): a `deploy-vps` job that
  # SSHes to the box, runs the bootstrap + `helm install`, then runs redteam.sh
  # over the remote context as the release gate — add only after the first
  # reproducibly-green manual pass.