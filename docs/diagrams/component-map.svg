<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#000000"/>

  <!-- spokes (drawn first, boxes cover the ends) -->
  <g stroke="#ffffff26" stroke-width="1.4">
    <line x1="450" y1="280" x2="160" y2="82"/>
    <line x1="450" y1="280" x2="740" y2="82"/>
    <line x1="450" y1="280" x2="140" y2="282"/>
    <line x1="450" y1="280" x2="770" y2="282"/>
    <line x1="450" y1="280" x2="160" y2="482"/>
    <line x1="450" y1="280" x2="740" y2="482"/>
  </g>

  <!-- center -->
  <rect x="360" y="250" width="180" height="60" rx="8" fill="#0b0607" stroke="#8C1C2B" stroke-width="1.6"/>
  <text x="450" y="278" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">AutoSploit AI</text>
  <text x="450" y="296" text-anchor="middle" fill="#b85a66" font-size="10">Bun + Turborepo · uv</text>

  <!-- client -->
  <rect x="40" y="40" width="240" height="84" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="58" y="66" fill="#ffffff" font-size="13" font-weight="600">client</text>
  <text x="58" y="88" fill="#a1a1aa" font-size="11">Next.js dashboard (App Router)</text>
  <text x="58" y="106" fill="#71717a" font-size="10.5">live SSE stream · report viewer</text>

  <!-- control-plane -->
  <rect x="620" y="40" width="240" height="84" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="638" y="66" fill="#ffffff" font-size="13" font-weight="600">control-plane</text>
  <text x="638" y="88" fill="#a1a1aa" font-size="11">NestJS on Fastify · 5 domains</text>
  <text x="638" y="106" fill="#71717a" font-size="10.5">Postgres · Redis · Redpanda · Vault</text>

  <!-- conductor -->
  <rect x="20" y="240" width="220" height="84" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="38" y="266" fill="#ffffff" font-size="13" font-weight="600">conductor</text>
  <text x="38" y="288" fill="#a1a1aa" font-size="11">one engagement, end to end</text>
  <text x="38" y="306" fill="#71717a" font-size="10.5">k8s mode + Phase A local</text>

  <!-- harness -->
  <rect x="660" y="240" width="220" height="84" rx="6" fill="#0e0e0e" stroke="#8C1C2B" stroke-width="1.4"/>
  <text x="678" y="266" fill="#ffffff" font-size="13" font-weight="600">harness</text>
  <text x="678" y="288" fill="#a1a1aa" font-size="11">LangGraph agent loop</text>
  <text x="678" y="306" fill="#71717a" font-size="10.5">interceptor · tools · gateway · ledger</text>

  <!-- provisioner -->
  <rect x="40" y="440" width="240" height="84" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="58" y="466" fill="#ffffff" font-size="13" font-weight="600">provisioner</text>
  <text x="58" y="488" fill="#a1a1aa" font-size="11">clone · build · discover ports</text>
  <text x="58" y="506" fill="#71717a" font-size="10.5">emit immutable scope.yaml</text>

  <!-- deploy -->
  <rect x="620" y="440" width="240" height="84" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="638" y="466" fill="#ffffff" font-size="13" font-weight="600">deploy</text>
  <text x="638" y="488" fill="#a1a1aa" font-size="11">Helm charts · kind cluster</text>
  <text x="638" y="506" fill="#71717a" font-size="10.5">terraform · vault wiring</text>
</svg>
