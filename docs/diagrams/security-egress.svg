  <text x="220" y="166" text-anchor="middle" fill="#a1a1aa" font-size="11">harness agent loop</text>
  <rect x="80" y="248" width="280" height="96" rx="6" fill="#0e0e0e" stroke="#8C1C2B" stroke-width="1.4"/>
