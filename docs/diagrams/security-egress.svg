<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#2f9e44"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8C1C2B"/></marker>
  </defs>
  <rect x="0" y="0" width="860" height="420" fill="#000000"/>

  <!-- sandbox container -->
  <rect x="40" y="56" width="360" height="320" rx="10" fill="#0b0607" stroke="#8C1C2B"/>
  <text x="60" y="82" fill="#b85a66" font-size="12" letter-spacing="2">PER-ENGAGEMENT SANDBOX · DEFAULT-DENY EGRESS</text>
  <rect x="80" y="104" width="280" height="96" rx="6" fill="#0e0e0e" stroke="#8C1C2B" stroke-width="1.4"/>
