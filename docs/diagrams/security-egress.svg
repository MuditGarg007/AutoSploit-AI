  <rect x="580" y="74" width="240" height="60" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="700" y="100" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Control plane</text>
  <text x="700" y="118" text-anchor="middle" fill="#a1a1aa" font-size="11">events ingest</text>
  <rect x="580" y="188" width="240" height="60" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="700" y="214" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Model API</text>
  <text x="700" y="232" text-anchor="middle" fill="#a1a1aa" font-size="11">allowlisted host</text>
  <rect x="580" y="302" width="240" height="60" rx="6" fill="#0e0e0e" stroke="#8C1C2B"/>
  <text x="700" y="328" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Open internet</text>
  <text x="700" y="346" text-anchor="middle" fill="#b85a66" font-size="11">no route out</text>

  <!-- attacker -> target : ALLOW -->
  <path d="M220,200 L220,246" fill="none" stroke="#2f9e44" stroke-width="1.8" marker-end="url(#g)"/>
  <text x="228" y="228" fill="#2f9e44" font-size="11">ALLOW · the pentest</text>

  <!-- attacker -> control plane : ALLOW events only -->
  <path d="M360,124 L578,106" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="396" y="104" fill="#2f9e44" font-size="11">ALLOW · events only</text>

  <!-- attacker -> model : ALLOW allowlisted -->
  <path d="M360,160 L578,210" fill="none" stroke="#2f9e44" stroke-width="1.8" marker-end="url(#g)"/>
  <text x="396" y="172" fill="#2f9e44" font-size="11">ALLOW · allowlisted</text>

  <!-- attacker -> internet : DENY -->
  <path d="M360,190 L578,318" fill="none" stroke="#8C1C2B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <text x="404" y="248" fill="#b85a66" font-size="11">DENY</text>

  <!-- target -> internet : DENY -->
  <path d="M360,318 L578,340" fill="none" stroke="#8C1C2B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <text x="430" y="326" fill="#b85a66" font-size="11">DENY</text>
</svg>
