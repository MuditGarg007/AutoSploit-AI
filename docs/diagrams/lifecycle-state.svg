<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#a1a1aa"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#2f9e44"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8C1C2B"/></marker>
  </defs>
  <rect x="0" y="0" width="820" height="470" fill="#000000"/>

  <!-- start dot -->
  <circle cx="400" cy="28" r="6" fill="#a1a1aa"/>

  <!-- state boxes -->
  <rect x="340" y="52" width="120" height="40" rx="6" fill="#0e0e0e" stroke="#ffffff33"/><text x="400" y="77" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">queued</text>
  <rect x="340" y="128" width="120" height="40" rx="6" fill="#0e0e0e" stroke="#ffffff33"/><text x="400" y="153" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">provisioning</text>
  <rect x="340" y="204" width="120" height="40" rx="6" fill="#0e0e0e" stroke="#ffffff33"/><text x="400" y="229" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">attacking</text>
  <rect x="340" y="280" width="120" height="40" rx="6" fill="#0e0e0e" stroke="#ffffff33"/><text x="400" y="305" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">reporting</text>
  <rect x="340" y="360" width="120" height="40" rx="6" fill="#0b120d" stroke="#2f9e44"/><text x="400" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">done</text>
  <rect x="580" y="128" width="140" height="40" rx="6" fill="#0b0607" stroke="#8C1C2B"/><text x="650" y="153" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">failed</text>
  <rect x="580" y="204" width="140" height="40" rx="6" fill="#0b0607" stroke="#8C1C2B"/><text x="650" y="229" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">halted</text>

  <!-- end dot (double) -->
  <circle cx="400" cy="436" r="9" fill="none" stroke="#a1a1aa" stroke-width="1.4"/>
  <circle cx="400" cy="436" r="5" fill="#a1a1aa"/>

  <!-- edges -->
  <path d="M400,34 L400,50" fill="none" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M400,92 L400,126" fill="none" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="408" y="113" fill="#a1a1aa" font-size="10.5">dequeued</text>
  <path d="M400,168 L400,202" fill="none" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="408" y="189" fill="#a1a1aa" font-size="10.5">target up + scope written</text>
  <path d="M400,244 L400,278" fill="none" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="408" y="265" fill="#a1a1aa" font-size="10.5">completed</text>
  <path d="M400,320 L400,358" fill="none" stroke="#2f9e44" stroke-width="1.4" marker-end="url(#g)"/>
  <text x="408" y="343" fill="#2f9e44" font-size="10.5">full report</text>

  <path d="M460,148 L578,148" fill="none" stroke="#8C1C2B" stroke-width="1.4" marker-end="url(#r)"/>
  <text x="468" y="142" fill="#b85a66" font-size="10.5">build or boot reject</text>
  <path d="M460,224 L578,224" fill="none" stroke="#8C1C2B" stroke-width="1.4" marker-end="url(#r)"/>
  <text x="468" y="218" fill="#b85a66" font-size="10.5">budget or scope cap</text>

  <path d="M650,168 C650,330 540,380 464,379" fill="none" stroke="#8C1C2B" stroke-width="1.4" marker-end="url(#r)"/>
  <text x="662" y="300" fill="#b85a66" font-size="10.5">reason recorded</text>
  <path d="M650,244 C650,320 540,392 464,392" fill="none" stroke="#8C1C2B" stroke-width="1.4" marker-end="url(#r)"/>
  <text x="520" y="360" fill="#b85a66" font-size="10.5">partial report</text>

  <path d="M400,400 L400,424" fill="none" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="408" y="418" fill="#a1a1aa" font-size="10.5">sandboxes torn down</text>
</svg>
