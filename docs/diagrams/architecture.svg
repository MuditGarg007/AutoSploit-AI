<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a1a1aa"/>
    </marker>
    <marker id="arwG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f9e44"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="700" fill="#000000"/>

  <!-- CLIENT band -->
  <rect x="20" y="20" width="920" height="78" rx="10" fill="#070707" stroke="#ffffff1f"/>
  <text x="36" y="42" fill="#71717a" font-size="12" letter-spacing="2">CLIENT · BROWSER</text>
  <rect x="360" y="50" width="240" height="40" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="480" y="68" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Next.js dashboard</text>
  <text x="480" y="83" text-anchor="middle" fill="#a1a1aa" font-size="11">GitHub login · repo picker · live feed · report</text>

  <!-- CONTROL PLANE band -->
  <rect x="20" y="150" width="920" height="186" rx="10" fill="#070707" stroke="#ffffff1f"/>
  <text x="36" y="172" fill="#71717a" font-size="12" letter-spacing="2">CONTROL PLANE · TRUSTED, STATELESS + STORES</text>
  <rect x="40" y="186" width="166" height="50" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="123" y="208" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Identity</text>
  <text x="123" y="224" text-anchor="middle" fill="#a1a1aa" font-size="11">OAuth · token vault</text>
  <rect x="220" y="186" width="166" height="50" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="303" y="208" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Lifecycle</text>
  <text x="303" y="224" text-anchor="middle" fill="#a1a1aa" font-size="11">engagement state</text>
  <rect x="400" y="186" width="166" height="50" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="483" y="208" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Telemetry</text>
  <text x="483" y="224" text-anchor="middle" fill="#a1a1aa" font-size="11">findings · cost · ingest</text>
  <rect x="580" y="186" width="140" height="50" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="650" y="208" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Reports</text>
  <text x="650" y="224" text-anchor="middle" fill="#a1a1aa" font-size="11">artifacts</text>
  <rect x="734" y="186" width="186" height="50" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="827" y="208" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Job queue</text>
  <text x="827" y="224" text-anchor="middle" fill="#a1a1aa" font-size="11">BullMQ on Redis</text>
  <rect x="40" y="268" width="160" height="40" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="120" y="292" text-anchor="middle" fill="#d4d4d8" font-size="11">Postgres</text>
  <rect x="214" y="268" width="160" height="40" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="294" y="292" text-anchor="middle" fill="#d4d4d8" font-size="11">Redpanda</text>
  <rect x="388" y="268" width="160" height="40" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="468" y="292" text-anchor="middle" fill="#d4d4d8" font-size="11">S3 / MinIO</text>
  <rect x="562" y="268" width="160" height="40" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="642" y="292" text-anchor="middle" fill="#d4d4d8" font-size="11">Vault Transit</text>
  <rect x="736" y="268" width="184" height="40" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="828" y="292" text-anchor="middle" fill="#d4d4d8" font-size="11">Redis Streams · SSE</text>

  <!-- ORCHESTRATION band -->
  <rect x="20" y="388" width="920" height="92" rx="10" fill="#070707" stroke="#ffffff1f"/>
  <text x="36" y="410" fill="#71717a" font-size="12" letter-spacing="2">ORCHESTRATION · IN-POD CONDUCTOR</text>
  <rect x="300" y="420" width="200" height="46" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="400" y="440" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Conductor</text>
  <text x="400" y="455" text-anchor="middle" fill="#a1a1aa" font-size="11">one engagement, end to end</text>
  <rect x="520" y="420" width="220" height="46" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="630" y="440" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Provisioner</text>
  <text x="630" y="455" text-anchor="middle" fill="#a1a1aa" font-size="11">clone · build · discover · scope</text>

  <!-- SANDBOX band -->
  <rect x="20" y="532" width="920" height="146" rx="10" fill="#0b0607" stroke="#8C1C2B"/>
  <text x="36" y="554" fill="#b85a66" font-size="12" letter-spacing="2">PER-ENGAGEMENT SANDBOX · K8S NAMESPACE · gVISOR · DEFAULT-DENY EGRESS</text>
  <rect x="60" y="572" width="260" height="78" rx="6" fill="#0e0e0e" stroke="#8C1C2B" stroke-width="1.4"/>
  <text x="190" y="604" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Attacker</text>
  <text x="190" y="621" text-anchor="middle" fill="#a1a1aa" font-size="11">harness agent loop</text>
  <rect x="360" y="572" width="300" height="78" rx="6" fill="#0e0e0e" stroke="#8C1C2B" stroke-width="1.4"/>
  <text x="510" y="604" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Target</text>
  <text x="510" y="621" text-anchor="middle" fill="#a1a1aa" font-size="11">deployed repo: app + db + cache</text>
  <rect x="700" y="572" width="200" height="78" rx="6" fill="#0e0e0e" stroke="#ffffff26"/>
  <text x="800" y="604" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Model API</text>
  <text x="800" y="621" text-anchor="middle" fill="#a1a1aa" font-size="11">OpenRouter · allowlisted</text>

  <!-- edges client <-> cp -->
  <path d="M455,98 L455,148" fill="none" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="448" y="128" text-anchor="end" fill="#a1a1aa" font-size="10.5">HTTPS</text>
  <path d="M505,150 L505,100" fill="none" stroke="#2f9e44" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arwG)"/>
  <text x="512" y="128" fill="#2f9e44" font-size="10.5">SSE events</text>

  <!-- queue -> conductor -->
  <path d="M827,308 C827,355 520,365 445,418" fill="none" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="650" y="356" text-anchor="middle" fill="#a1a1aa" font-size="10.5">dequeue job</text>

  <!-- conductor -> provisioner -->
  <path d="M500,443 L518,443" fill="none" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- provisioner -> target -->
  <path d="M630,466 L525,570" fill="none" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="600" y="524" fill="#a1a1aa" font-size="10.5">target + scope.yaml</text>

  <!-- conductor -> attacker -->
  <path d="M360,466 L200,570" fill="none" stroke="#a1a1aa" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="244" y="524" text-anchor="end" fill="#a1a1aa" font-size="10.5">launch</text>

  <!-- attacker -> target -->
  <path d="M320,611 L358,611" fill="none" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#arwG)"/>
  <text x="340" y="604" text-anchor="middle" fill="#2f9e44" font-size="10.5">attack</text>

  <!-- attacker -> model -->
  <path d="M660,626 L698,626" fill="none" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#arwG)"/>

  <!-- attacker -> telemetry ingest, up left margin -->
  <path d="M60,592 C34,592 34,211 38,211" fill="none" stroke="#2f9e44" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arwG)"/>
  <text x="22" y="400" transform="rotate(-90 22 400)" text-anchor="middle" fill="#2f9e44" font-size="10.5">events ingest</text>
</svg>
