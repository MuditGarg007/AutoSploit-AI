apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "control-plane.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# Role binding so Vault's k8s auth method can validate the pod's service-account
# token (optional; only needed when the plane authenticates to Vault via k8s auth).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "control-plane.fullname" . }}-vault-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "control-plane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.engagementOps }}
---
# Engagement-ops ClusterRole (engagement-pipeline handoff #2, architecture A). The
# conductor's --k8s path, running in the plane pod, stands up and tears down a
# per-engagement namespace and its workloads: it creates/deletes namespaces, and
# within them pods (reading pod logs for the build/attack phases), services,
# secrets and configmaps, plus the CiliumNetworkPolicy CRD that enforces SEAM-1
# egress (conductor k8s/{provision,manifests,client,mirror}.py; Helm stores the
# engagement release state as Secrets, covered below). Broad power for the
# internet-facing app — the accepted tradeoff of the fat-image path.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "control-plane.fullname" . }}-engagement-ops
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "secrets", "configmaps"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "control-plane.fullname" . }}-engagement-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "control-plane.fullname" . }}-engagement-ops
subjects:
  - kind: ServiceAccount
    name: {{ include "control-plane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}