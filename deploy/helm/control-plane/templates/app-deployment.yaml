apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "control-plane.fullname" . }}-app
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: app
        # SEAM-1 edge 4: the engagement CiliumNetworkPolicy allows attacker egress to
        # the control plane by matching pods labelled `app: control-plane` in this
        # namespace (conductor k8s/manifests.py CONTROL_PLANE_SELECTOR). This is a pod
        # label only — the Deployment selector deliberately stays on the app.kubernetes.io
        # keys so it is unaffected.
        app: control-plane
      annotations:
        {{- with .Values.serviceMonitor }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .path | quote }}
        prometheus.io/port: "3000"
        {{- end }}
    spec:
      serviceAccountName: {{ include "control-plane.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      # Private GHCR pull (CI pushes ghcr.io/<owner>/control-plane private). Each entry
      # is {name: <docker-registry secret>}; empty by default for public images.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: control-plane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: {{ .Values.app.args | toJson }}
          ports:
            - containerPort: 3000
              name: http
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
            # External dependency endpoints.
            - name: DATABASE_URL
              value: {{ required ".Values.external.postgresUrl is required" .Values.external.postgresUrl | quote }}
            - name: REDIS_URL
              value: {{ required ".Values.external.redisUrl is required" .Values.external.redisUrl | quote }}
            - name: KAFKA_BROKERS
              value: {{ .Values.external.kafkaBrokers | quote }}
            - name: SCHEMA_REGISTRY_URL
              value: {{ .Values.external.schemaRegistryUrl | quote }}
            - name: VAULT_ADDR
              value: {{ .Values.external.vaultAddr | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.external.s3Endpoint | quote }}
            - name: S3_BUCKET
              value: {{ .Values.external.s3Bucket | quote }}
            # Conductor execution (engagement-pipeline handoff #2, architecture A).
            # The worker shells `conductor run [--k8s --target-port]`; the fat image
            # bundles the conductor + python + git + crane + helm + engagement chart.
            - name: CONDUCTOR_K8S
              value: {{ .Values.conductor.k8s | quote }}
            - name: CONDUCTOR_DEFAULT_TARGET_PORT
              value: {{ .Values.conductor.defaultTargetPort | quote }}
            - name: CONDUCTOR_TIMEOUT_S
              value: {{ .Values.conductor.timeoutS | quote }}
            - name: CONDUCTOR_OUT_DIR
              value: {{ .Values.conductor.outDir | quote }}
            - name: AUTOSPLOIT_ENGAGEMENT_CHART
              value: {{ .Values.conductor.engagementChart | quote }}
            {{- with .Values.conductor.harnessImage }}
            - name: AUTOSPLOIT_HARNESS_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.secretRef }}
            # Conductor model key (architecture A): the conductor runs in this pod,
            # so OPENROUTER_API_KEY is injected here by name. optional:true so the
            # app still boots if the key is absent (the conductor fails the run, not
            # boot); see values.yaml OPENROUTER note on the relaxed §6 split.
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: OPENROUTER_API_KEY
                  optional: true
            # Secrets referenced by name only — nothing is inlined in the chart.
            - name: INGEST_TOKEN_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: INGEST_TOKEN_SIGNING_KEY
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: JWT_REFRESH_SECRET
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: GITHUB_CLIENT_SECRET
            - name: GITHUB_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: GITHUB_CALLBACK_URL
            - name: VAULT_TRANSIT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: VAULT_TRANSIT_KEY
            # Static Vault token for the dev/no-k8s-auth path. Optional: absent in
            # prod, where VaultService authenticates with the pod ServiceAccount
            # (§9.1). When present (dev Vault, docs/vps-vault-oauth-handoff.md
            # Path A), VaultService uses it as the client token.
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: VAULT_TOKEN
                  optional: true
            {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}