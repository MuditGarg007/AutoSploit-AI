# Values for the control-plane chart (docs/component-h-hardening.md §8.2). Secrets
# are injected at deploy time via Vault k8s auth or k8s Secrets — NEVER baked into
# the image (§8.1).
#
# OPENROUTER_API_KEY: the engagement-pipeline fat-image path (handoff #2,
# architecture A) runs the conductor IN-PROCESS inside the plane pod, so the
# conductor's model key must now be injected into this pod's env. It is referenced
# by secretKeyRef (key OPENROUTER_API_KEY in secretRef.name) — never inlined here
# and never baked into the image. This relaxes the §6 secret-split (SEAM-2) by
# design. NOTE: a CI leak scanner previously asserted the key never appears in
# plane config; that check must be updated for architecture A or it will fail this
# chart. Reverting to the separate-conductor-Job design restores the strict split.

image:
  repository: ghcr.io/autosploit/control-plane
  tag: latest
  pullPolicy: IfNotPresent
  # imagePullSecrets for a private GHCR package. Each entry is {name: <secret>} where
  # the secret is a docker-registry Secret (e.g. `kubectl create secret docker-registry
  # ghcr-pull ...`). Empty when the package is public. Set per deploy, e.g.
  # `--set image.pullSecrets[0].name=ghcr-pull`.
  pullSecrets: []

# Optional override for the generated resource name (default: <release>-control-plane).
fullnameOverride: ""

replicaCount: 1

strategy:
  type: RollingUpdate

# One image runs the HTTP app AND the BullMQ worker in the same Nest process (the
# module factory registers the Worker), so a single Deployment serves both (§8.1,
# §3.5). This chart ships ONE long-lived Deployment — the ephemeral per-engagement
# chart is the orchestration layer's, not this one's.
app:
  args: ["node", "dist/main.js"]
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

# Schema migrations. A Helm pre-install,pre-upgrade hook Job runs the drizzle
# migrator (`node dist/db/migrate.js`) against external.postgresUrl BEFORE the app
# rolls out, so a fresh database always has its tables before a pod serves a
# request (templates/migrate-job.yaml). Idempotent — drizzle's __drizzle_migrations
# table skips applied migrations, so it no-ops once the schema is current. Disable
# only when migrations are applied out-of-band.
migrations:
  enabled: true
  # Job retries before it is marked failed (the deploy then aborts — fail-closed).
  backoffLimit: 1
  # Hard ceiling so a stuck migration cannot block a deploy indefinitely.
  activeDeadlineSeconds: 120
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "250m", memory: "256Mi" }

service:
  type: ClusterIP
  port: 80

probes:
  livenessPath: /health
  readinessPath: /health

# External dependencies the plane depends on (Postgres / Redis / Redpanda / Vault /
# S3). Parameterized as endpoints; on the self-hosted VPS these point at the
# ops-managed deps stood up in-namespace (docs/vps-h3-runbook.md §5.3), set via
# `--set external.*`. Subcharts for stateful deps are intentionally OUT of scope here —
# the orchestration layer and ops own those (§8.2).
external:
  postgresUrl: postgres://postgres@postgres:5432/control_plane
  redisUrl: redis://redis:6379
  kafkaBrokers: redpanda:9092
  schemaRegistryUrl: http://redpanda:8081
  vaultAddr: http://vault:8200
  s3Endpoint: http://minio:9000
  s3Bucket: autosploit-reports

# Environment variables applied to BOTH app + worker from values. Secret values are
# referenced by name (`secretKeyRef`) only — never inlined here.
env:
  NODE_ENV: production
  LOG_LEVEL: info
  PUBLIC_BASE_URL: http://control-plane
  OTEL_ENABLED: "false"
  # Browser frontend origin(s) for the CORS allowlist + OAuth post-login redirect
  # (comma-separated, no trailing slash). Override per deploy with
  # `--set env.FRONTEND_URL=https://<your-vercel-origin>`.
  FRONTEND_URL: http://localhost:3000

# Reference to the k8s Secret that holds the shared secrets
# (INGEST_TOKEN_SIGNING_KEY, JWT_* , GITHUB_* OAuth, VAULT_DEV token when using a
# local vault). Values come from an external Secret name, never committed.
secretRef:
  name: control-plane-secrets

# Conductor execution (engagement-pipeline handoff #2, architecture A). The worker
# shells `conductor run` as a subprocess; the fat image bundles the conductor +
# python + git + crane + helm + the engagement chart.
conductor:
  # Drive the cluster (conductor run --k8s) rather than local docker. MUST be true
  # in k8s (no docker socket in the pod); false keeps the Phase A dev/test argv.
  k8s: true
  # Fallback scope port passed to --target-port when a create request omits
  # targetPort (the per-engagement value takes precedence).
  defaultTargetPort: 5000
  # Timeout (s) for a whole engagement run (CONDUCTOR_TIMEOUT_S).
  timeoutS: 3600
  # Writable base --out dir; the record lands at <outDir>/<id>/conductor.json. /tmp
  # is writable by the non-root runtime user and needs no extra volume.
  outDir: /tmp/autosploit-runs
  # Digest-pinned attacker harness image for the engagement (AUTOSPLOIT_HARNESS_IMAGE).
  # Empty falls back to the conductor's built-in placeholder default. Set per deploy,
  # e.g. `--set conductor.harnessImage=ghcr.io/<owner>/harness@sha256:...`.
  harnessImage: ""
  # Path to the per-engagement Helm chart inside the image (AUTOSPLOIT_ENGAGEMENT_CHART).
  # The image already bakes this default; override only if relocated.
  engagementChart: /app/engagement-chart

# RBAC for the conductor's --k8s path. When conductor.k8s is true the plane's
# ServiceAccount needs cluster-wide permission to create/tear down per-engagement
# namespaces and their workloads (namespaces, pods, pods/log, services, secrets,
# configmaps) plus the CiliumNetworkPolicy CRD (SEAM-1 egress). This is broad power
# granted to the internet-facing app — the accepted tradeoff of architecture A.
rbac:
  # Create the engagement-ops ClusterRole + binding. Keep in sync with conductor.k8s.
  engagementOps: true

serviceAccount:
  create: true
  name: ""
  # The plane's own ServiceAccount is wired to Vault's k8s auth method
  # (§9.1 / §8.2) so VaultService authenticates with the pod identity instead of
  # a static bootstrap secret (EnvService keys off KUBERNETES_SERVICE_HOST).
  annotations:
    vault.hashicorp.com/agent-inject: "false"
    # When Vault Agent deploys (ops preference), mount the transit key here:
    vault.hashicorp.com/agent-pre-populate-only: "true"

# Horizontal autoscaling (optional; default off — singular long-lived workload).
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Prometheus scraping via the prometheus.io/scrape annotation (Red metrics on
# GET /metrics, §6.1).
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics